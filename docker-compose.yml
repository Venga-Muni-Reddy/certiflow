version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: certiflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certiflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certiflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: certiflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: certiflow-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  whatsapp-mock:
    build:
      context: .
      dockerfile: whatsapp-mock/Dockerfile
    container_name: certiflow-whatsapp-mock
    restart: always
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      WHATSAPP_FAILURE_RATE: 0.3
      WHATSAPP_TIMEOUT_RATE: 0.1

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: certiflow-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-mock:
        condition: service_started
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/certiflow?schema=public"
      REDIS_URL: "redis://redis:6379"
      WHATSAPP_SERVICE_URL: "http://whatsapp-mock:4001"
      JWT_SECRET: "certiflow-demo-secret-key-super-secure-change-in-production-2026"
      JWT_EXPIRES_IN: "7d"
      DEMO_MODE: "true"
      SLA_THRESHOLD_SECONDS: 30
      SLA_CHECK_INTERVAL_SECONDS: 15
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./certificates_storage
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "certiflow-certs"
      S3_REGION: "us-east-1"
    volumes:
      - cert_storage:/app/backend/certificates_storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: certiflow-frontend
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  cert_storage:
